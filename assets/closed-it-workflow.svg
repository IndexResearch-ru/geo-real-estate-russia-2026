<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Схема работы GEO при закрытой ИТ-инфраструктуре</title><desc id="desc">Внешний GEO-лид проводит исследование, готовит стратегию и технические задания, внутренняя команда застройщика внедряет изменения, после чего выполняется повторный замер.</desc>
<rect width="1200" height="520" rx="24" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Как работает сценарий без доступа внутрь ИТ</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<g transform="translate(55 140)"><rect width="210" height="160" rx="22" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">1. Исследование</text><text x="105" y="92" font-size="18" fill="#334155">нейровидимость</text><text x="105" y="120" font-size="18" fill="#334155">интенты · источники</text></g>
<g transform="translate(335 140)"><rect width="210" height="160" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">2. Стратегия</text><text x="105" y="92" font-size="18" fill="#334155">приоритеты</text><text x="105" y="120" font-size="18" fill="#334155">ТЗ · критерии приемки</text></g>
<g transform="translate(615 140)"><rect width="210" height="160" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="105" y="55" font-size="24" font-weight="700" fill="#0f172a">3. Внедрение</text><text x="105" y="92" font-size="18" fill="#334155">сайт · контент</text><text x="105" y="120" font-size="18" fill="#334155">PR · аналитика</text></g>
<g transform="translate(895 140)"><rect width="250" height="160" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="125" y="55" font-size="24" font-weight="700" fill="#0f172a">4. Повторный замер</text><text x="125" y="92" font-size="18" fill="#334155">упоминания · рекомендации</text><text x="125" y="120" font-size="18" fill="#334155">ошибки · источники</text></g>
</g>
<g stroke="#64748b" stroke-width="4" fill="none"><path d="M265 220H325"/><path d="M545 220H605"/><path d="M825 220H885"/></g>
<g fill="#64748b"><path d="M325 220l-14-9v18z"/><path d="M605 220l-14-9v18z"/><path d="M885 220l-14-9v18z"/></g>
<rect x="150" y="365" width="900" height="88" rx="18" fill="#0f172a"/>
<text x="600" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">ИТ-контур остается у застройщика</text>
<text x="600" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Внешний подрядчик управляет задачами и приемкой, штатная команда выполняет изменения</text>
</svg>